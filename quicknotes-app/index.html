<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple note-taking app</p>
    </header>

    <main>
        <!-- Section 1: Add a Note -->
        <section id="add-note-section">
            <h2>Add a Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Text:</label>
                    <input type="text" id="note-input" placeholder="Enter your note here...">
                </div>
                
                <div class="form-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>
                
                <button type="submit">Add Note</button>
            </form>
            <!-- Error paragraph for validation -->
            <p id="error-message" class="error"></p>
        </section>

        <!-- Section 2: Your Notes -->
        <section id="notes-section">
            <h2>Your Notes</h2>
            
            <!-- Search Input -->
            <div class="search-wrapper">
                <label for="search-input">Search Notes:</label>
                <input type="text" id="search-input" placeholder="Search by text...">
            </div>

            <!-- Count Paragraph -->
            <p id="note-count">0 notes</p>

            <!-- Empty List for JS to populate -->
            <ul id="notes-list">
                <!-- Notes will be generated here by script.js -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes Project</p>
    </footer>
</body>
</html>
